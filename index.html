<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stanford ML · Visual Explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#050c1a;overflow-x:hidden}
*{box-sizing:border-box}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#050c1a}
::-webkit-scrollbar-thumb{background:#1a3a5c;border-radius:3px}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:#1a3a5c;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid #050c1a}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const P = {
  bg:"#050c1a", card:"#08142a", cardHi:"#0c1e3a",
  bd:"#163050", bdHi:"#1e4272",
  tl:"#22d3ee", go:"#f59e0b", gn:"#4ade80",
  rd:"#f87171", vl:"#a78bfa", pk:"#f472b6", or:"#fb923c",
  tx:"#d8eaf8", t2:"#6090b8", t3:"#1e3a55",
};

const CHAPTERS = [
  { id:0, week:"W1",   tab:"Overview",   title:"What is Machine Learning?",  accent:P.tl },
  { id:1, week:"W2",   tab:"Lin. Reg.",  title:"Linear Regression",           accent:P.go },
  { id:2, week:"W2",   tab:"Grad. Desc", title:"Gradient Descent",            accent:P.gn },
  { id:3, week:"W3",   tab:"Logistic",   title:"Logistic Regression",         accent:P.vl },
  { id:4, week:"W4-5", tab:"Neural Net", title:"Neural Networks",             accent:P.or },
  { id:5, week:"W6",   tab:"Bias/Var.",  title:"Bias\u2013Variance Tradeoff", accent:P.rd },
  { id:6, week:"W7",   tab:"SVM",        title:"Support Vector Machines",     accent:P.tl },
  { id:7, week:"W8",   tab:"K-Means",    title:"K-Means & PCA",               accent:P.vl },
  { id:8, week:"W9",   tab:"Anomaly",    title:"Anomaly Detection",           accent:P.gn },
];

const Formula = ({children, accent=P.tl}) => (
  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,padding:"8px 14px",
    background:P.card,border:`1px solid ${P.bd}`,borderLeft:`3px solid ${accent}`,
    borderRadius:6,color:P.tx,margin:"8px 0",lineHeight:1.7}}>
    {children}
  </div>
);

const Tag = ({children, color}) => (
  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,padding:"2px 7px",
    background:`${color}22`,border:`1px solid ${color}44`,borderRadius:3,color,marginRight:4}}>
    {children}
  </span>
);

function OverviewViz() {
  const cats = [
    { label:"Supervised Learning", color:P.tl, desc:"Train on labeled (x,y) pairs",
      items:[{icon:"📈",name:"Regression",ex:"House prices, temperature forecasting"},
             {icon:"🏷️",name:"Classification",ex:"Spam detection, medical diagnosis"}]},
    { label:"Unsupervised Learning", color:P.vl, desc:"Discover hidden structure",
      items:[{icon:"🫧",name:"Clustering",ex:"Customer segmentation, K-Means"},
             {icon:"📐",name:"Dimensionality Reduction",ex:"PCA, data compression"}]},
    { label:"Reinforcement Learning", color:P.go, desc:"Learn via reward signals",
      items:[{icon:"🎮",name:"Policy Learning",ex:"Game playing, robotic control"},
             {icon:"🔁",name:"Q-Learning",ex:"Navigation, resource management"}]},
  ];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {cats.map(cat=>(
        <div key={cat.label} style={{background:P.card,border:`1px solid ${cat.color}33`,borderRadius:10,padding:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:cat.color,display:"block",flexShrink:0}}/>
            <span style={{fontFamily:"'Lora',serif",fontWeight:600,color:cat.color,fontSize:14}}>{cat.label}</span>
            <span style={{fontFamily:"'Lora',serif",fontStyle:"italic",color:P.t2,fontSize:12}}>&ndash; {cat.desc}</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {cat.items.map(item=>(
              <div key={item.name} style={{background:P.cardHi,borderRadius:7,padding:"10px 12px"}}>
                <div style={{fontSize:18,marginBottom:4}}>{item.icon}</div>
                <div style={{fontFamily:"'Lora',serif",fontWeight:600,color:P.tx,fontSize:13}}>{item.name}</div>
                <div style={{fontFamily:"'Lora',serif",color:P.t2,fontSize:11.5,marginTop:2,lineHeight:1.5}}>{item.ex}</div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

const LR_PTS = [[0.3,1.3],[0.7,2.0],[1.0,2.4],[1.4,3.5],[1.8,3.9],[2.2,4.9],[2.6,5.1],
[3.0,6.2],[3.4,6.7],[3.8,7.6],[0.5,0.9],[1.2,2.8],[2.0,3.7],[2.8,5.8],[3.3,6.0],
[0.9,2.1],[1.7,3.8],[2.5,5.3],[3.1,5.9],[3.6,7.0]];

function LinearRegressionViz() {
  const [t0, setT0] = useState(0.4);
  const [t1, setT1] = useState(1.85);
  const W=500,H=280, mxX=4, mxY=8;
  const sx=x=>22+x/mxX*(W-44);
  const sy=y=>H-18-y/mxY*(H-36);
  const mse = LR_PTS.reduce((s,[x,y])=>s+(t0+t1*x-y)**2,0)/LR_PTS.length;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}>
        {[0,2,4,6,8].map(v=><line key={v} x1={22} x2={W-22} y1={sy(v)} y2={sy(v)} stroke={P.bd} strokeWidth={0.5}/>)}
        {[0,1,2,3,4].map(v=><line key={v} x1={sx(v)} x2={sx(v)} y1={18} y2={H-18} stroke={P.bd} strokeWidth={0.5}/>)}
        {LR_PTS.map(([x,y],i)=>{
          const py=t0+t1*x;
          return <line key={i} x1={sx(x)} y1={sy(y)} x2={sx(x)} y2={sy(py)} stroke={P.rd} strokeWidth={1} strokeDasharray="3,2" opacity={0.5}/>;
        })}
        <line x1={sx(0)} y1={sy(t0)} x2={sx(mxX)} y2={sy(t0+t1*mxX)} stroke={P.tl} strokeWidth={2.5}/>
        {LR_PTS.map(([x,y],i)=><circle key={i} cx={sx(x)} cy={sy(y)} r={4.5} fill={P.go} stroke={P.bg} strokeWidth={1}/>)}
        <text x={W/2} y={H-3} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono">x (input feature)</text>
        <text x={9} y={H/2} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono" transform={`rotate(-90,9,${H/2})`}>y (output)</text>
        <text x={W-26} y={sy(t0+t1*mxX)-6} fill={P.tl} fontSize={10} fontFamily="JetBrains Mono">h(x)</text>
      </svg>
      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10,padding:"9px 14px",
        background:P.card,borderRadius:8,fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>
        <span style={{color:P.t2}}>J(theta) =</span>
        <span style={{color:mse<1?P.gn:mse<2.5?P.go:P.rd,fontWeight:600,fontSize:15}}>{mse.toFixed(3)}</span>
        <span style={{color:P.t3}}>MSE</span>
        <span style={{marginLeft:"auto",color:P.t2}}>h(x) = {t0.toFixed(2)} + {t1.toFixed(2)}x</span>
      </div>
      <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:7}}>
        {[{label:"theta_0",sub:"intercept",val:t0,set:setT0,min:-1,max:3,step:0.05,clr:P.go},
          {label:"theta_1",sub:"slope",   val:t1,set:setT1,min:0, max:4,step:0.05,clr:P.tl}].map(s=>(
          <div key={s.label} style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:s.clr,minWidth:140}}>{s.label} ({s.sub})</span>
            <input type="range" min={s.min} max={s.max} step={s.step} value={s.val}
              onChange={e=>s.set(parseFloat(e.target.value))} style={{flex:1,accentColor:s.clr}}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:P.tx,minWidth:36}}>{s.val.toFixed(2)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function GradientDescentViz() {
  const [alpha, setAlpha] = useState(0.25);
  const [theta, setTheta] = useState(-0.5);
  const [history, setHistory] = useState([-0.5]);
  const [running, setRunning] = useState(false);
  const [steps, setSteps] = useState(0);
  const tRef = useRef(-0.5);
  const aRef = useRef(0.25);
  useEffect(()=>{ aRef.current=alpha; },[alpha]);
  useEffect(()=>{
    if(!running) return;
    const id = setInterval(()=>{
      const t = tRef.current;
      const grad = 2*(t-3);
      const nt = t - aRef.current * grad;
      if(Math.abs(nt-3)<0.008){ tRef.current=3; setTheta(3); setHistory(h=>[...h,3]); setRunning(false); return; }
      if(Math.abs(nt)>15){ setRunning(false); return; }
      tRef.current=nt; setTheta(nt);
      setHistory(h=>[...h.slice(-60),nt]);
      setSteps(s=>s+1);
    },90);
    return ()=>clearInterval(id);
  },[running]);
  const reset = ()=>{ tRef.current=-0.5; setTheta(-0.5); setHistory([-0.5]); setRunning(false); setSteps(0); };
  const J = t=>(t-3)**2+0.5;
  const W=500,H=280, tMin=-1, tMax=7, jMax=18;
  const tx=t=>24+(t-tMin)/(tMax-tMin)*(W-48);
  const ty=j=>H-18-j/jMax*(H-36);
  const pts = Array.from({length:100},(_,i)=>{ const t=tMin+i/99*(tMax-tMin); return `${tx(t)},${ty(J(t))}`; }).join(" ");
  const converged = Math.abs(theta-3)<0.01;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}>
        {[0,4,8,12,16].map(v=><line key={v} x1={24} x2={W-24} y1={ty(v)} y2={ty(v)} stroke={P.bd} strokeWidth={0.5}/>)}
        <line x1={tx(3)} x2={tx(3)} y1={18} y2={H-18} stroke={P.gn} strokeWidth={1} strokeDasharray="5,3" opacity={0.6}/>
        <text x={tx(3)+4} y={26} fill={P.gn} fontSize={9} fontFamily="JetBrains Mono">theta* = 3</text>
        <polyline points={pts} fill="none" stroke={P.vl} strokeWidth={2.5}/>
        {history.map((t,i)=>( i<history.length-1 &&
          <line key={i} x1={tx(t)} y1={ty(J(t))} x2={tx(history[i+1])} y2={ty(J(history[i+1]))}
            stroke={P.tl} strokeWidth={1.5} opacity={0.3+0.7*(i/history.length)}/>
        ))}
        {history.map((t,i)=>(
          <circle key={i} cx={tx(t)} cy={ty(J(t))} r={2.5} fill={P.tl} opacity={0.2+0.8*(i/history.length)}/>
        ))}
        <circle cx={tx(theta)} cy={ty(J(theta))} r={9} fill={converged?P.gn:P.go} stroke={P.bg} strokeWidth={2}/>
        <text x={W/2} y={H-3} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono">theta (parameter value)</text>
        <text x={9} y={H/2} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono" transform={`rotate(-90,9,${H/2})`}>J(theta)</text>
      </svg>
      <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <button onClick={()=>setRunning(r=>!r)} disabled={converged}
          style={{padding:"6px 16px",background:running?P.rd:P.gn,color:"#000",border:"none",
            borderRadius:6,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:600,opacity:converged?.5:1}}>
          {running?"⏸ Pause":"▶ Run"}
        </button>
        <button onClick={reset} style={{padding:"6px 14px",background:P.card,color:P.tx,
          border:`1px solid ${P.bd}`,borderRadius:6,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>Reset</button>
        <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:180}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:P.tl,flexShrink:0}}>α =</span>
          <input type="range" min={0.05} max={0.9} step={0.05} value={alpha}
            onChange={e=>{reset();setAlpha(parseFloat(e.target.value))}} style={{flex:1,accentColor:P.tl}}/>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:P.go,minWidth:32}}>{alpha}</span>
        </div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:P.t2}}>
          step <span style={{color:P.tx}}>{steps}</span> · θ=<span style={{color:P.go}}>{theta.toFixed(3)}</span>
          {converged&&<span style={{color:P.gn}}> ✓ converged!</span>}
        </div>
      </div>
    </div>
  );
}

const LOG_PTS = [
  {x:1.2,y:1.3,c:0},{x:2.1,y:1.7,c:0},{x:1.5,y:2.4,c:0},{x:2.5,y:2.0,c:0},
  {x:0.8,y:1.4,c:0},{x:1.8,y:0.9,c:0},{x:3.0,y:1.6,c:0},{x:1.0,y:3.1,c:0},
  {x:4.5,y:4.3,c:1},{x:5.0,y:3.8,c:1},{x:4.2,y:5.5,c:1},{x:5.5,y:4.2,c:1},
  {x:4.8,y:5.0,c:1},{x:3.8,y:4.4,c:1},{x:5.2,y:4.8,c:1},{x:4.3,y:3.7,c:1},
];

function LogisticRegressionViz() {
  const [hoverZ, setHoverZ] = useState(0);
  const W=500,H=260;
  const sigmoid=z=>1/(1+Math.exp(-z));
  const halfW=W/2-10;
  const sz=z=>28+(z+5)/10*(halfW-30);
  const sp=p=>H-18-p*(H-36);
  const sigPts = Array.from({length:100},(_,i)=>{ const z=-5+i/99*10; return `${sz(z)},${sp(sigmoid(z))}`; }).join(" ");
  const mxX=6.5, mxY=7;
  const cpx=x=>W/2+18+x/mxX*(W/2-28);
  const cpy=y=>H-18-y/mxY*(H-36);
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}
        onMouseMove={e=>{
          const r=e.currentTarget.getBoundingClientRect();
          const mx=(e.clientX-r.left)/r.width*W;
          if(mx<W/2){ const z=(mx-28)/(halfW-30)*10-5; setHoverZ(parseFloat(z.toFixed(1))); }
        }}>
        <text x={halfW/2} y={13} textAnchor="middle" fill={P.vl} fontSize={9.5} fontFamily="JetBrains Mono">σ(z) = 1 / (1 + e⁻ᶻ)  ← hover to explore</text>
        {[0,0.25,0.5,0.75,1].map(v=>(
          <line key={v} x1={28} x2={halfW} y1={sp(v)} y2={sp(v)} stroke={P.bd} strokeWidth={0.5}/>
        ))}
        <line x1={sz(0)} x2={sz(0)} y1={20} y2={H-18} stroke={P.t3} strokeWidth={0.8} strokeDasharray="3,2"/>
        <line x1={28} x2={halfW} y1={sp(0.5)} y2={sp(0.5)} stroke={P.t3} strokeWidth={0.8} strokeDasharray="3,2"/>
        <polyline points={sigPts} fill="none" stroke={P.vl} strokeWidth={2.5}/>
        <circle cx={sz(hoverZ)} cy={sp(sigmoid(hoverZ))} r={5} fill={P.go} stroke={P.bg} strokeWidth={1.5}/>
        <text x={sz(hoverZ)+7} y={sp(sigmoid(hoverZ))-5} fill={P.go} fontSize={9} fontFamily="JetBrains Mono">z={hoverZ.toFixed(1)} → {sigmoid(hoverZ).toFixed(2)}</text>
        {[0,0.5,1].map(v=><text key={v} x={22} y={sp(v)+3} textAnchor="end" fill={P.t2} fontSize={8} fontFamily="JetBrains Mono">{v}</text>)}
        <text x={halfW/2} y={H-3} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono">z (linear input)</text>
        <line x1={W/2} x2={W/2} y1={15} y2={H-10} stroke={P.bd} strokeWidth={1}/>
        <text x={W/2+cpx(3.3)-W/2} y={13} textAnchor="middle" fill={P.tx} fontSize={9.5} fontFamily="JetBrains Mono">Decision Boundary</text>
        <line x1={cpx(0)} y1={cpy(6.5)} x2={cpx(6.5)} y2={cpy(0)} stroke={P.tl} strokeWidth={1.8} strokeDasharray="5,3"/>
        {LOG_PTS.map((pt,i)=>(
          <circle key={i} cx={cpx(pt.x)} cy={cpy(pt.y)} r={5}
            fill={pt.c===0?P.rd:P.tl} stroke={P.bg} strokeWidth={1} opacity={0.85}/>
        ))}
        <text x={cpx(0.4)} y={cpy(6.2)} fill={P.rd} fontSize={9} fontFamily="JetBrains Mono">y=0</text>
        <text x={cpx(4.0)} y={cpy(5.8)} fill={P.tl} fontSize={9} fontFamily="JetBrains Mono">y=1</text>
        <text x={W/2+(W/4)} y={H-3} textAnchor="middle" fill={P.t2} fontSize={9} fontFamily="JetBrains Mono">x₁</text>
      </svg>
    </div>
  );
}

function NeuralNetViz() {
  const [active, setActive] = useState(-1);
  const [firing, setFiring] = useState(false);
  const layers = [2,4,4,1];
  const W=500,H=280;
  const lx=(li)=>60+li*(W-120)/3;
  const ny=(li,ni)=>{
    const n=layers[li], totalH=(n-1)*60+20, startY=(H-totalH)/2;
    return startY+ni*60+10;
  };
  const fire = ()=>{
    if(firing) return;
    setFiring(true); setActive(-1);
    const delays=[0,400,800,1200,1600];
    delays.forEach((d,i)=>setTimeout(()=>setActive(i<4?i:-1),d));
    setTimeout(()=>{setFiring(false);setActive(-1);},2000);
  };
  const nodeColor=(li)=>{
    if(active<0) return P.card;
    if(active===li) return P.or;
    if(active>li) return `${P.or}44`;
    return P.card;
  };
  const edgeOpacity=(li)=>{
    if(active<0) return 0.15;
    if(active===li+1) return 0.9;
    if(active>li+1) return 0.35;
    return 0.1;
  };
  const lc=[P.tl,P.vl,P.vl,P.go];
  const lnames=["Input","Hidden 1","Hidden 2","Output"];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}>
        {layers.slice(0,-1).map((_,li)=>(
          Array.from({length:layers[li]},(_2,ni)=>(
            Array.from({length:layers[li+1]},(_3,nj)=>(
              <line key={`${li}-${ni}-${nj}`} x1={lx(li)} y1={ny(li,ni)} x2={lx(li+1)} y2={ny(li+1,nj)}
                stroke={lc[li]} strokeWidth={0.8} opacity={edgeOpacity(li)}/>
            ))
          ))
        ))}
        {layers.map((n,li)=>(
          <g key={li}>
            <text x={lx(li)} y={H-8} textAnchor="middle" fill={lc[li]} fontSize={9} fontFamily="JetBrains Mono">{lnames[li]}</text>
            {Array.from({length:n},(_,ni)=>(
              <g key={ni}>
                <circle cx={lx(li)} cy={ny(li,ni)} r={18} fill={nodeColor(li)} stroke={lc[li]}
                  strokeWidth={active===li?2.5:1.2} opacity={active===li?1:0.7}/>
                {active===li&&<circle cx={lx(li)} cy={ny(li,ni)} r={22} fill="none" stroke={lc[li]} strokeWidth={0.8} opacity={0.5}/>}
                <text x={lx(li)} y={ny(li,ni)+4} textAnchor="middle" fill={P.tx} fontSize={li===3?11:10} fontFamily="JetBrains Mono">
                  {li===0?`x${ni+1}`:li===3?"ŷ":`a${li}`}
                </text>
              </g>
            ))}
          </g>
        ))}
        {active>=0&&active<4&&(
          <text x={W/2} y={22} textAnchor="middle" fill={P.or} fontSize={10} fontFamily="JetBrains Mono">
            {["Computing input","Hidden layer 1 activating","Hidden layer 2 activating","Output computed!"][active]}
          </text>
        )}
      </svg>
      <div style={{display:"flex",gap:10,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
        <button onClick={fire} disabled={firing}
          style={{padding:"7px 20px",background:firing?P.t3:P.or,color:"#000",border:"none",
            borderRadius:6,cursor:firing?"not-allowed":"pointer",fontFamily:"'JetBrains Mono',monospace",
            fontSize:13,fontWeight:600,opacity:firing?0.6:1}}>
          {firing?"⚡ Propagating…":"▶ Forward Pass"}
        </button>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:P.t2}}>
          Architecture: <span style={{color:P.tx}}>2→4→4→1</span> · Activation: <span style={{color:P.vl}}>sigmoid</span>
        </div>
      </div>
    </div>
  );
}

function BiasVarianceViz() {
  const W=500,H=270;
  const hW=W/2-8;
  const mkCurve=(mxN,trainFn,cvFn)=>{
    const pts=Array.from({length:40},(_,i)=>i/(39)*mxN);
    return { train:pts.map(x=>({x,y:trainFn(x)})), cv:pts.map(x=>({x,y:cvFn(x)})) };
  };
  const biasCurve = mkCurve(100, x=>0.7-0.003*x, x=>0.75-0.002*x);
  const varCurve  = mkCurve(100, x=>Math.max(0.05,0.7*Math.exp(-0.06*x)), x=>0.6+0.003*x);
  const toPath=(pts,mxX,mxY,ox,W2,H2)=>{
    return pts.map((p,i)=>{
      const ppx=ox+24+p.x/mxX*(W2-32);
      const ppy=H2-24-p.y/mxY*(H2-40);
      return `${i===0?"M":"L"}${ppx},${ppy}`;
    }).join(" ");
  };
  const panels=[
    {label:"High Bias (Underfitting)", color:P.go, curve:biasCurve, note:"Train ≈ CV error, both HIGH"},
    {label:"High Variance (Overfitting)", color:P.rd, curve:varCurve, note:"Train LOW, CV HIGH → gap"},
  ];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}>
      {panels.map((panel,pi)=>{
        const ox=pi*(hW+16);
        const mxX=100,mxY=0.9;
        const ttx=x=>ox+24+x/mxX*(hW-32);
        const tty=y=>H-24-y/mxY*(H-40);
        return (
          <g key={pi}>
            <text x={ox+hW/2} y={14} textAnchor="middle" fill={panel.color} fontSize={9.5} fontFamily="JetBrains Mono">{panel.label}</text>
            {[0,0.3,0.6,0.9].map(v=><line key={v} x1={ox+24} x2={ox+hW-8} y1={tty(v)} y2={tty(v)} stroke={P.bd} strokeWidth={0.5}/>)}
            <line x1={ox+24} x2={ox+24} y1={20} y2={H-24} stroke={P.bd} strokeWidth={0.8}/>
            <path d={toPath(panel.curve.train,mxX,mxY,ox,hW,H)} fill="none" stroke={P.tl} strokeWidth={2}/>
            <path d={toPath(panel.curve.cv,mxX,mxY,ox,hW,H)} fill="none" stroke={P.rd} strokeWidth={2} strokeDasharray="5,3"/>
            <text x={ox+hW-12} y={tty(panel.curve.train[39].y)+3} fill={P.tl} fontSize={8} fontFamily="JetBrains Mono" textAnchor="end">train</text>
            <text x={ox+hW-12} y={tty(panel.curve.cv[39].y)+3} fill={P.rd} fontSize={8} fontFamily="JetBrains Mono" textAnchor="end">CV</text>
            <text x={ox+hW/2} y={H-6} textAnchor="middle" fill={P.t2} fontSize={8} fontFamily="JetBrains Mono">training set size →</text>
            <text x={ox+hW/2} y={H-15} textAnchor="middle" fill={panel.color} fontSize={8} fontFamily="JetBrains Mono">{panel.note}</text>
          </g>
        );
      })}
      <line x1={W/2} x2={W/2} y1={20} y2={H-18} stroke={P.bd} strokeWidth={1}/>
    </svg>
  );
}

function AnomalyViz() {
  const [eps, setEps] = useState(0.04);
  const W=500,H=270;
  const cx=W/2, cy=H/2, sigmaX=110, sigmaY=75;
  const gaussian=(x,y)=>Math.exp(-0.5*((x-cx)**2/sigmaX**2+(y-cy)**2/sigmaY**2));
  const NORMAL_PTS=[
    {x:450,y:130},{x:480,y:145},{x:465,y:120},{x:495,y:138},{x:440,y:148},
    {x:470,y:155},{x:485,y:125},{x:450,y:140},{x:480,y:132},{x:460,y:115},
    {x:475,y:160},{x:445,y:125},{x:490,y:150},{x:465,y:135},{x:478,y:142},
  ];
  const ANOMALY_PTS=[{x:80,y:50},{x:430,y:220},{x:70,y:200},{x:160,y:240}];
  const ALL_PTS=[...NORMAL_PTS,...ANOMALY_PTS];
  const isAnomaly=pt=>gaussian(pt.x,pt.y)<eps;
  const ELLIPSES=[0.9,0.7,0.5,0.3,0.15,0.07,0.03];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",background:P.card,borderRadius:10}}>
        {ELLIPSES.map(lv=>{
          const a=sigmaX*Math.sqrt(-2*Math.log(lv)), b=sigmaY*Math.sqrt(-2*Math.log(lv));
          return <ellipse key={lv} cx={cx} cy={cy} rx={Math.max(0,a)} ry={Math.max(0,b)}
            fill="none" stroke={P.tl} strokeWidth={0.8} opacity={Math.min(0.6,lv*0.8)}/>;
        })}
        {(()=>{
          const a=sigmaX*Math.sqrt(-2*Math.log(eps)), b=sigmaY*Math.sqrt(-2*Math.log(eps));
          return <ellipse cx={cx} cy={cy} rx={Math.max(0,a)} ry={Math.max(0,b)}
            fill={`${P.rd}0a`} stroke={P.rd} strokeWidth={2} strokeDasharray="6,3"/>;
        })()}
        {ALL_PTS.map((pt,i)=>{
          const anom=isAnomaly(pt);
          return (
            <g key={i}>
              <circle cx={pt.x} cy={pt.y} r={anom?9:5} fill={anom?P.rd:P.gn} stroke={P.bg} strokeWidth={1.2} opacity={0.85}/>
              {anom&&<text x={pt.x} y={pt.y-13} textAnchor="middle" fill={P.rd} fontSize={10} fontFamily="JetBrains Mono">!</text>}
            </g>
          );
        })}
        <text x={W-8} y={20} textAnchor="end" fill={P.rd} fontSize={9} fontFamily="JetBrains Mono">— ε threshold</text>
        <text x={W-8} y={33} textAnchor="end" fill={P.gn} fontSize={9} fontFamily="JetBrains Mono">● normal</text>
        <text x={W-8} y={46} textAnchor="end" fill={P.rd} fontSize={9} fontFamily="JetBrains Mono">● anomaly</text>
        <text x={W/2} y={cy+4} textAnchor="middle" fill={P.tl} fontSize={9} fontFamily="JetBrains Mono" opacity={0.5}>p(x) density contours</text>
      </svg>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:P.gn,minWidth:20}}>ε =</span>
        <input type="range" min={0.01} max={0.25} step={0.01} value={eps}
          onChange={e=>setEps(parseFloat(e.target.value))} style={{flex:1,accentColor:P.rd}}/>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:P.rd,minWidth:50}}>{eps.toFixed(2)}</span>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:P.t2}}>
          flagged: <span style={{color:P.rd}}>{ALL_PTS.filter(isAnomaly).length}</span>/{ALL_PTS.length}
        </span>
      </div>
    </div>
  );
}

      "Backpropagation: after seeing how wrong the output was, errors flow BACKWARDS to adjust weights. Like getting a test back, seeing your mistakes, and updating your study strategy.",
      "Common activations: sigmoid (0 to 1), tanh (−1 to 1), ReLU (max(0,x)). ReLU is most popular now because it avoids the 'vanishing gradient' problem in deep networks.",
    ],
    formula:<><div style={{color:P.or}}>a^(l) = g(Theta^(l) * a^(l-1))  [forward prop]</div><div style={{color:P.t2,marginTop:6}}>delta^(l) = (Theta^(l))^T * delta^(l+1) .* g'(z^(l))</div></>,
    tags:["Week 4-5","Deep Learning","Backprop"],
    Viz:NeuralNetViz
  },
  {
    bullets:[
      "The fundamental ML tradeoff: a model can be TOO SIMPLE (fails to learn) or TOO COMPLEX (memorizes everything, including noise). Both are bad!",
      "High Bias (underfitting): like a student who only studied one formula and applies it to every problem. Both training error AND cross-validation error are HIGH. The model isn't powerful enough.",
      "High Variance (overfitting): like a student who memorized all 500 practice problems word-for-word but bombs the real test because questions are slightly different. Train error LOW, CV error HIGH.",
      "Learning curves show train and CV error vs. training set size m. If they stay high and close together → high bias (need a better model). If there's a BIG GAP → high variance (need more data or regularization).",
      "Fixes for High Bias: use a more complex model, add more features, decrease regularization λ, train longer. Fixes for High Variance: get more data, fewer features, increase λ, use dropout.",
      "Error analysis: manually look at 100 examples your model gets wrong. What patterns do you see? This tells you where to invest improvement effort — far more efficient than random guessing.",
      "Regularization λ: like a 'simplicity tax'. Large λ → model gets penalized for complex weights → forced to be simple → may underfit. Small λ → complex model allowed → may overfit.",
    ],
    formula:<><div style={{color:P.rd}}>Total Error = Bias^2 + Variance + Irreducible Noise</div><div style={{color:P.t2,marginTop:6}}>High bias: J_train ~= J_cv (both high). High var: J_train {"<<"} J_cv</div></>,
    tags:["Week 6","Diagnostics","Regularization"],
    Viz:BiasVarianceViz
  },
  {
    bullets:[
      "SVM = Support Vector Machine. Goal: find the widest possible 'street' between two classes. The centerline is the decision boundary, and it's chosen to maximize the margin (street width).",
      "Why maximum margin? A wider street means the classifier is more confident and more robust — small changes in new data points won't flip the decision. It generalizes better!",
      "Support Vectors are the training points closest to the decision boundary (the 'edge houses' on each side of the street). They're the ONLY points that define the boundary — all others are irrelevant!",
      "The circled points in the visualization ARE the support vectors. Delete all other training points and you'd get the SAME boundary. That's a powerful insight about what matters.",
      "Soft-margin (parameter C): large C = zero tolerance, hard margin — classify everything correctly even if the margin is tiny. Small C = allow some misclassification for a wider, more robust margin.",
      "Kernel trick: for non-linearly separable data (like circles), kernels secretly map inputs to higher dimensions where they ARE linearly separable — without ever computing those high-dimensional coordinates!",
      "RBF (Gaussian) kernel: K(x,z) = exp(−||x−z||²/2σ²). Imagine placing a Gaussian bump at each training point — the decision boundary curves around clusters. Incredibly powerful for complex boundaries.",
    ],
    formula:<><div style={{color:P.tl}}>Maximize margin 2/||w||, subject to: yi*(w^T*xi + b) &gt;= 1</div><div style={{color:P.t2,marginTop:6}}>RBF Kernel: K(x,z) = exp(-||x-z||^2 / (2*sigma^2))</div></>,
    tags:["Week 7","SVM","Kernel Trick"],
    Viz:SVMViz
  },
  {
    bullets:[
      "K-Means Clustering: sort unlabeled data into K groups automatically. Like sorting a mixed bag of Halloween candy into piles — red ones, yellow ones, green ones — without being told the categories!",
      "Algorithm: (1) Randomly place K centroids. (2) Assign each point to its nearest centroid. (3) Move centroids to the mean of their assigned points. (4) Repeat until centroids stop moving!",
      "Real uses: Netflix/Spotify grouping users by behavior, image compression (reduce 16 million colors to 256), Google News clustering articles by topic, customer segmentation in marketing.",
      "Choosing K: try the 'elbow method' — plot distortion vs K. The elbow point where adding more clusters stops helping much is often the right K. But sometimes business context decides K.",
      "PCA (Principal Component Analysis): finds the most informative directions in high-dimensional data. Like finding the best angle to photograph a 3D sculpture to capture the most detail in 2D.",
      "PC1 (teal arrow): the direction of maximum variance — the axis where data spreads out the most. PC2 (violet arrow): second most informative direction, always perpendicular to PC1.",
      "PCA applications: compress a 1000-feature dataset to 50 features while keeping 99% of information. Speed up training by 20×. Visualize high-dimensional data in 2D. Used in face recognition!",
    ],
    formula:<><div style={{color:P.vl}}>c^(i) = argmin_k ||x^(i) - mu_k||^2  [assign]</div><div style={{color:P.t2,marginTop:6}}>mu_k = mean of points in cluster k  [update]  |  PCA: Sigma = 1/m * X^T*X</div></>,
    tags:["Week 8","Unsupervised","PCA"],
    Viz:KMeansPCAViz
  },
  {
    bullets:[
      "Anomaly detection = finding the 'weird ones'. Like a bouncer who's seen thousands of normal-looking guests — after a while, they instantly spot someone unusual even without a specific rule.",
      "Model what 'normal' looks like using a Gaussian (bell curve) distribution for each feature. If a new example has very low probability under this model (p(x) < ε), it's flagged as anomalous.",
      "Real examples: credit card fraud (unusual amount or location), server monitoring (CPU suddenly spikes to 100%), factory quality control (product measurements way outside normal range).",
      "Multivariate Gaussian captures correlations between features. Example: CPU=100% alone might be normal. Memory=1% alone might be normal. But CPU=100% AND Memory=1% TOGETHER is suspicious!",
      "Choosing ε: use a LABELED cross-validation set with some known anomalies. Try different ε values and pick the one that maximizes F1 score — balancing precision (low false alarms) and recall (catch real anomalies).",
      "Anomaly detection vs. supervised classification: use anomaly detection when anomalies are VERY RARE (maybe 0.1% of data) or when future anomalies might look completely different from past ones.",
      "Drag the ε slider: too high → cry-wolf effect (flag normal things as anomalies). Too low → miss real anomalies. Watch how the red-flagged points change with ε!",
    ],
    formula:<><div style={{color:P.gn}}>p(x) = Product_j N(x_j; mu_j, sigma_j^2)</div><div style={{color:P.t2,marginTop:6}}>Flag anomaly if p(x) {"<"} epsilon  |  Choose epsilon to maximize F1 on CV set</div></>,
    tags:["Week 9","Gaussian","Anomaly"],
    Viz:AnomalyViz
  },
];

function MLExplainer() {
  const [active, setActive] = useState(0);
  const chapter = CHAPTERS[active];
  const content = CHAPTER_CONTENT[active];
  const { Viz } = content;
  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",background:P.bg,fontFamily:"'Lora',Georgia,serif",color:P.tx}}>
      <div style={{padding:"14px 24px 10px",borderBottom:`1px solid ${P.bd}`,background:`${P.card}cc`,
        backdropFilter:"blur(8px)",position:"sticky",top:0,zIndex:10,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"baseline",gap:14,flexWrap:"wrap"}}>
          <span style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:17,
            background:`linear-gradient(90deg,${P.tl},${P.vl})`,WebkitBackgroundClip:"text",
            WebkitTextFillColor:"transparent",letterSpacing:"-0.3px"}}>
            Stanford ML · Visual Explainer
          </span>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:P.t2}}>
            Andrew Ng's Coursera Course · 9 Interactive Chapters
          </span>
        </div>
      </div>
      <div style={{display:"flex",gap:2,padding:"8px 16px",borderBottom:`1px solid ${P.bd}`,
        overflowX:"auto",background:P.card,flexShrink:0}}>
        {CHAPTERS.map(c=>{
          const isActive=c.id===active;
          return (
            <button key={c.id} onClick={()=>setActive(c.id)}
              style={{padding:"6px 12px",background:isActive?`${c.accent}22`:P.bg,
                border:`1px solid ${isActive?c.accent:P.bd}`,borderRadius:6,
                cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                color:isActive?c.accent:P.t2,whiteSpace:"nowrap",transition:"all .15s",flexShrink:0}}>
              <span style={{opacity:0.6,marginRight:4}}>{c.week}</span>{c.tab}
            </button>
          );
        })}
      </div>
      <div style={{flex:1,display:"grid",gridTemplateColumns:"minmax(260px,38%) 1fr",overflow:"hidden"}}>
        <div style={{padding:"20px 24px",borderRight:`1px solid ${P.bd}`,overflowY:"auto",background:P.card}}>
          <div style={{marginBottom:6,display:"flex",gap:4,flexWrap:"wrap"}}>
            {content.tags.map(t=><Tag key={t} color={chapter.accent}>{t}</Tag>)}
          </div>
          <h2 style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:20,color:P.tx,margin:"10px 0 14px",lineHeight:1.3}}>
            {chapter.title}
          </h2>
          <ul style={{listStyle:"none",padding:0,margin:"0 0 14px",display:"flex",flexDirection:"column",gap:8}}>
            {content.bullets.map((b,i)=>(
              <li key={i} style={{display:"flex",gap:9,alignItems:"flex-start"}}>
                <span style={{color:chapter.accent,flexShrink:0,marginTop:3,fontSize:10,fontFamily:"'JetBrains Mono',monospace"}}>▸</span>
                <span style={{fontFamily:"'Lora',serif",fontSize:13.5,color:P.tx,lineHeight:1.65}}>{b}</span>
              </li>
            ))}
          </ul>
          {content.formula&&<Formula accent={chapter.accent}>{content.formula}</Formula>}
          <div style={{display:"flex",gap:8,marginTop:18}}>
            {active>0&&<button onClick={()=>setActive(a=>a-1)}
              style={{padding:"5px 12px",background:P.cardHi,color:P.t2,border:`1px solid ${P.bd}`,
                borderRadius:5,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>← Prev</button>}
            {active<CHAPTERS.length-1&&<button onClick={()=>setActive(a=>a+1)}
              style={{padding:"5px 12px",background:chapter.accent,color:"#000",border:"none",
                borderRadius:5,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:600}}>
              Next Chapter →</button>}
          </div>
        </div>
        <div style={{padding:"18px 20px",overflowY:"auto",background:P.bg}}>
          <div style={{marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:3,height:18,background:chapter.accent,borderRadius:2}}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:chapter.accent}}>Interactive Visualization</span>
          </div>
          <Viz />
        </div>
      </div>
      <div style={{padding:"8px 24px",borderTop:`1px solid ${P.bd}`,background:P.card,
        display:"flex",gap:10,alignItems:"center",flexShrink:0}}>
        {CHAPTERS.map(c=>(
          <button key={c.id} onClick={()=>setActive(c.id)}
            style={{width:8,height:8,borderRadius:"50%",border:"none",cursor:"pointer",
              background:c.id===active?c.accent:P.bd,transition:"all .2s",padding:0}}/>
        ))}
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:P.t3,marginLeft:"auto"}}>
          {active+1} / {CHAPTERS.length}
        </span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MLExplainer />);
</script>
</body>
</html>
